name: verify

on:
  pull_request:
  push:
    branches: [main]
  # 生產線用 GITHUB_TOKEN 開的 PR 不會觸發 pull_request 事件，改由 pipeline.yml 手動觸發。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
